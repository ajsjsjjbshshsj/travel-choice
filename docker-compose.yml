services:
  mysql:
    image: mysql:8.4
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travel_decision_platform}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: travel-kafka
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@travel-kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://travel-kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-topic-init:
    image: bitnami/kafka:3.7
    container_name: travel-kafka-topic-init
    depends_on:
      - kafka
    command: >
      bash -c "sleep 10 &&
      kafka-topics.sh --bootstrap-server travel-kafka:29092 --create --if-not-exists
      --topic ${RECOMMEND_REQUEST_TOPIC:-recommend_request_event}
      --partitions 3 --replication-factor 1"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: travel-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-travel_realtime}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  flink-jobmanager:
    image: flink:1.19-java17
    container_name: travel-flink-jobmanager
    restart: unless-stopped
    profiles:
      - realtime
    ports:
      - "${FLINK_WEB_PORT:-8081}:8081"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: travel-flink-jobmanager
      KAFKA_BOOTSTRAP_SERVERS: travel-kafka:29092
      RECOMMEND_REQUEST_TOPIC: ${RECOMMEND_REQUEST_TOPIC:-recommend_request_event}
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DATABASE:-travel_realtime}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      HOT_DESTINATION_TOP_N: ${HOT_DESTINATION_TOP_N:-10}
      HOT_DESTINATION_WINDOW_MINUTES: ${HOT_DESTINATION_WINDOW_MINUTES:-5}
    volumes:
      - ./travel-realtime-flink/target:/opt/flink/usrlib
    depends_on:
      - kafka
      - clickhouse

  flink-taskmanager:
    image: flink:1.19-java17
    container_name: travel-flink-taskmanager
    restart: unless-stopped
    profiles:
      - realtime
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: travel-flink-jobmanager
      KAFKA_BOOTSTRAP_SERVERS: travel-kafka:29092
      RECOMMEND_REQUEST_TOPIC: ${RECOMMEND_REQUEST_TOPIC:-recommend_request_event}
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DATABASE:-travel_realtime}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      HOT_DESTINATION_TOP_N: ${HOT_DESTINATION_TOP_N:-10}
      HOT_DESTINATION_WINDOW_MINUTES: ${HOT_DESTINATION_WINDOW_MINUTES:-5}
    depends_on:
      - flink-jobmanager

  airflow:
    image: apache/airflow:2.9.3
    container_name: travel-airflow
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      clickhouse:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      TRAVEL_API_BASE_URL: ${TRAVEL_API_BASE_URL:-http://host.docker.internal:8080/api}
      KAFKA_BOOTSTRAP_SERVERS: travel-kafka:29092
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
    ports:
      - "${AIRFLOW_PORT:-8088}:8080"
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags:ro
      - airflow-data:/opt/airflow
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Travel --lastname Admin --role Admin --email admin@example.com || true &&
      airflow standalone"
    profiles:
      - airflow

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  clickhouse-data:
  airflow-data:
